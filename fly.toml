# fly.toml app configuration file generated for meowsformer on 2026-04-04T22:55:46-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meowsformer'
primary_region = 'ewr'

[build]
  # Docker build-arg for Dockerfile: FETCH_DATA=true runs tools.download_datasets in the image.
  args = { FETCH_DATA = "true" }

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
